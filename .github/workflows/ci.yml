name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python scripts/privacy_scan.py .
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check --no-cache src tests scripts
      - run: python -m ruff format --check --no-cache src tests scripts
      - run: effect-witness verify --artifact-dir evidence/reference-v0.1.0
      - run: >-
          effect-witness verify-replay
          --artifact-dir evidence/reference-v0.3.0-langgraph-replay-windows
      - run: python -m build
      - run: python scripts/verify_distribution_boundary.py dist

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  real-filesystem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.18.0"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python scripts/prepare_filesystem_server.py
          --output-dir .real-filesystem-deps
      - run: >-
          effect-witness run-filesystem
          --output-dir artifacts/real-filesystem
          --dependency-dir .real-filesystem-deps
          --source-revision ${{ github.sha }}
      - run: >-
          effect-witness verify-filesystem
          --artifact-dir artifacts/real-filesystem
      - run: python scripts/privacy_scan.py artifacts/real-filesystem

  langgraph-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.18.0"
      - run: >-
          python -m pip install
          --constraint integrations/langgraph/constraints.txt
          -e ".[dev,langgraph-replay]"
      - run: >-
          python scripts/prepare_filesystem_server.py
          --output-dir .replay-filesystem-deps
      - run: >-
          effect-witness run-replay
          --constraints-file integrations/langgraph/constraints.txt
          --output-dir artifacts/langgraph-replay
          --dependency-dir .replay-filesystem-deps
          --source-revision ${{ github.sha }}
      - run: >-
          effect-witness verify-replay
          --artifact-dir artifacts/langgraph-replay
      - run: python scripts/privacy_scan.py artifacts/langgraph-replay
