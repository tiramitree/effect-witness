[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "effect-witness"
version = "0.3.3"
description = "Auditable evidence for declared agent-tool effects and bounded real implementations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "httpx==0.28.1",
  "mcp==1.28.1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/tiramitree/effect-witness"
Issues = "https://github.com/tiramitree/effect-witness/issues"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]
langgraph-replay = [
  "langgraph==1.2.9",
  "langgraph-checkpoint==4.1.1",
  "langgraph-checkpoint-sqlite==3.1.0",
  "sqlite-vec==0.1.9",
]

[project.scripts]
effect-witness = "effect_witness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/effect_witness"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
